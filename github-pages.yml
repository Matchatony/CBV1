# Publishes this site to GitHub Pages.
# Move this file to .github/workflows/pages.yml, then set
# Settings -> Pages -> Source: GitHub Actions.

name: Deploy Crackbotics site

on:
  push:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # No build step — the site is plain HTML/CSS.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
