<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orders | Crackbotics</title>
<meta name="theme-color" content="#14121A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .admin { max-width: 1040px; margin: 0 auto; padding: 32px 20px 80px; }
  .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .admin-head h1 { margin: 0; font-size: 26px; }
  .admin-head .wordmark { font-size: 22px; }
  .card { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  .login { max-width: 380px; }
  .login label { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
  .admin input[type="password"], .admin input[type="search"], .admin input[type="text"], .admin input[type="date"], .admin select, .admin textarea {
    font: inherit; font-size: 15px; color: var(--text); background: var(--bg); border: 1px solid var(--line-firm);
    border-radius: 6px; padding: 9px 11px; width: 100%; box-sizing: border-box; }
  .admin textarea { min-height: 80px; resize: vertical; }
  .admin button { font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 6px; padding: 9px 14px;
    border: 1px solid var(--line-firm); background: transparent; color: var(--text); }
  .admin button.primary { background: var(--accent); border-color: var(--accent); color: #14121a; }
  .admin button.danger { border-color: #c96b7a; color: #f0a4b0; }
  .admin button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar { display: grid; grid-template-columns: 1fr 190px auto; gap: 10px; margin-bottom: 14px; }
  .tabs { display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .admin .tabs button.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 14px; color: var(--muted); }
  .admin .tabs button.tab[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tabs #refresh { margin: 0 0 8px auto; }
  .admin button.sm { font-size: 13px; padding: 5px 10px; }
  .admin a.btn-link { font-size: 13px; font-weight: 500; padding: 5px 10px; border: 1px solid var(--line-firm); border-radius: 6px; color: var(--text); text-decoration: none; white-space: nowrap; }
  .deliv-bar { margin-bottom: 18px; color: var(--muted); font-size: 14px; }
  .deliv-bar label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .day { margin: 0 0 26px; }
  .day-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
  .day-head h2 { font-size: 18px; margin: 0; }
  .day-head .row { margin-left: auto; }
  .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .tag.today { color: var(--accent); }
  .tag.late { color: #f0a4b0; }
  .sub { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 14px 0 8px; }
  .stops { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .stop { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    display: grid; grid-template-columns: 44px 1fr auto; gap: 6px 12px; align-items: start; }
  .stop-num { font-family: var(--mono); font-size: 20px; line-height: 1.2; color: var(--accent); display: grid; gap: 4px; justify-items: start; }
  .stop-num .move { display: flex; gap: 2px; }
  .admin .stop-num .move button { padding: 1px 6px; font-size: 12px; line-height: 1.4; }
  .stop-main { display: grid; gap: 3px; font-size: 14px; min-width: 0; }
  .stop-main .who-line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .stop-main .who-line b { font-size: 15px; }
  .stop-main .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .stop-main a { color: var(--accent); overflow-wrap: anywhere; }
  .stop-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .st { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-firm); color: var(--muted); }
  .st.ready { color: #7fd8d8; border-color: #7fd8d8; }
  .st.early { color: #f2c27b; border-color: #f2c27b; }
  .edit { grid-column: 1 / -1; display: grid; grid-template-columns: 170px 170px 1fr; gap: 8px; align-items: end; margin-top: 6px; }
  .edit[hidden] { display: none; }
  .edit label { display: grid; gap: 4px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .edit .row { grid-column: 1 / -1; }
  .print-only { display: none; }
  @media print {
    body.printing { background: #fff !important; }
    body.printing * { color: #000 !important; background: transparent !important; box-shadow: none !important; }
    body.printing .admin-head, body.printing .tabs, body.printing #app-msg, body.printing #view-orders, body.printing .deliv-bar,
    body.printing .day:not(.print-me), body.printing .no-print, body.printing .stop-actions, body.printing .move, body.printing .edit { display: none !important; }
    body.printing .stop { border: 1px solid #888 !important; break-inside: avoid; grid-template-columns: 44px 1fr; }
    body.printing .print-only { display: block; }
  }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip { font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line-firm); color: var(--muted); background: none; }
  .chip b { color: var(--text); font-weight: 500; }
  .msg { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
  .msg.bad { color: #f0a4b0; }
  .orders { display: grid; gap: 10px; }
  .order { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; }
  .order.open { border-color: var(--line-firm); }
  .order-head { display: grid; grid-template-columns: 1fr 150px; gap: 12px; align-items: center; padding: 0 16px 0 0; }
  .admin button.toggle { all: unset; box-sizing: border-box; cursor: pointer; padding: 14px 0 14px 16px; display: grid;
    grid-template-columns: 96px 1fr 120px 110px; gap: 12px; align-items: center; text-align: left; border-radius: 8px; }
  .admin button.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .when { font-family: var(--mono); font-size: 12px; color: var(--faint); line-height: 1.35; }
  .who b { display: block; font-weight: 600; }
  .who span { font-size: 13px; color: var(--muted); }
  .price { font-family: var(--mono); font-size: 14px; }
  .price.hand { color: var(--accent); }
  .badge { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line-firm); color: var(--muted); justify-self: start; }
  .status-select { font-size: 13px !important; padding: 6px 8px !important; }
  .s-new { border-left: 3px solid var(--accent); }
  .s-quoted { border-left: 3px solid #9fb7ff; }
  .s-paid { border-left: 3px solid #8fd6a8; }
  .s-in-progress { border-left: 3px solid #f2c27b; }
  .s-ready { border-left: 3px solid #7fd8d8; }
  .s-done, .s-cancelled { border-left: 3px solid var(--line-firm); opacity: .72; }
  .body { padding: 4px 16px 18px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
  .body[hidden] { display: none; }
  .facts { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 12px 0 0; font-size: 14px; }
  .facts dt { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding-top: 2px; }
  .facts dd { margin: 0; overflow-wrap: anywhere; font-size: 15px; line-height: 1.45; font-family: var(--sans); letter-spacing: normal; color: var(--text); }
  .facts a { color: var(--accent); }
  .warn { color: #f0a4b0; }
  pre.summary { margin: 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; color: var(--muted);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  @media (max-width: 760px) {
    .stop { grid-template-columns: 40px 1fr; }
    .admin .stop-num .move { flex-direction: column; gap: 6px; }
    .admin .stop-num .move button { padding: 6px 11px; font-size: 14px; }
    .stop-actions { grid-column: 1 / -1; justify-content: flex-start; }
    .edit { grid-template-columns: 1fr 1fr; }
    .edit .addr-field { grid-column: 1 / -1; }
    .day-head .row { margin-left: 0; }
    .toolbar { grid-template-columns: 1fr 1fr; }
    .toolbar #q, .toolbar #filter { grid-column: 1 / -1; }
    .order-head { grid-template-columns: 1fr; padding: 0 16px 14px 0; }
    .order-head .status-select { margin-left: 16px; width: calc(100% - 16px); }
    .admin button.toggle { grid-template-columns: 1fr auto; }
    .admin button.toggle .when { grid-column: 1 / -1; }
    .facts { grid-template-columns: 1fr; }
    .facts dt { padding-top: 6px; }
  }
</style>
</head>
<body>
<main class="admin">
  <div class="admin-head">
    <div class="row">
      <a class="wordmark" href="index.html"><span class="wordmark-crack">crack</span><span class="wordmark-botics">botics</span></a>
      <h1>Orders</h1>
    </div>
    <button type="button" id="signout" hidden>Sign out</button>
  </div>

  <form class="card login" id="login">
    <label for="pw">Admin password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <div class="row" style="margin-top:12px"><button class="primary" type="submit">Sign in</button></div>
    <p class="msg" id="login-msg" role="status"></p>
  </form>

  <section id="app" hidden>
    <div class="tabs">
      <button type="button" class="tab" id="tab-orders" aria-pressed="true">Orders</button>
      <button type="button" class="tab" id="tab-deliv" aria-pressed="false">Deliveries</button>
      <button type="button" id="refresh">Refresh</button>
    </div>
    <p class="msg" id="app-msg" role="status"></p>
    <div id="view-orders">
      <div class="toolbar">
        <input type="search" id="q" placeholder="Search name, team, email, part, notes…" aria-label="Search orders">
        <select id="filter" aria-label="Filter by status"></select>
        <button type="button" id="dl-all" disabled>Download files</button>
      </div>
      <div class="counts" id="counts"></div>
      <div class="orders" id="orders"></div>
    </div>
    <div id="view-deliv" hidden>
      <div class="row deliv-bar">
        <label><input type="checkbox" id="with-pickups" checked> Include pickups</label>
      </div>
      <div id="deliv"></div>
    </div>
  </section>
</main>

<script>
(function () {
  var LABELS = { 'new': 'New', quoted: 'Quoted', paid: 'Paid', 'in-progress': 'In progress', ready: 'Ready', done: 'Done', cancelled: 'Cancelled' };
  var OPEN = ['new', 'quoted', 'paid', 'in-progress', 'ready'];
  var state = { pw: '', orders: [], statuses: Object.keys(LABELS) };
  var $ = function (id) { return document.getElementById(id); };

  // Builds elements with text only — order data never goes through innerHTML.
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }

  function storeGet() { try { return sessionStorage.getItem('cb-admin') || ''; } catch (e) { return ''; } }
  function storeSet(v) { try { v ? sessionStorage.setItem('cb-admin', v) : sessionStorage.removeItem('cb-admin'); } catch (e) {} }

  function api(method, body) {
    return fetch('/api/orders', {
      method: method,
      headers: Object.assign({ authorization: 'Bearer ' + state.pw }, body ? { 'content-type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
      cache: 'no-store'
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401) { signOut('Wrong password.'); throw new Error('unauthorized'); }
        if (!r.ok) throw new Error(j.error || ('Server error ' + r.status));
        return j;
      });
    });
  }

  // PATCHes go out one at a time: the server does read-modify-write per order,
  // so two overlapping edits to the same order could otherwise drop one.
  var queue = Promise.resolve();
  function patch(o, changes) {
    var p = queue.then(function () { return api('PATCH', Object.assign({ id: o.id }, changes)); })
      .then(function (j) { Object.assign(o, j.order); return o; });
    queue = p.catch(function () {});
    return p;
  }
  function failed(what) {
    return function (err) { if (err.message !== 'unauthorized') say('app-msg', 'Couldn\'t ' + what + ': ' + err.message, true); };
  }

  function say(id, text, bad) { $(id).textContent = text; $(id).className = 'msg' + (bad ? ' bad' : ''); }

  function signOut(message) {
    state.pw = ''; storeSet('');
    $('app').hidden = true; $('signout').hidden = true; $('login').hidden = false;
    $('orders').textContent = '';
    say('login-msg', message || '', !!message);
  }

  function load() {
    say('app-msg', 'Loading…');
    $('refresh').disabled = true;
    return api('GET').then(function (j) {
      state.orders = j.orders || [];
      if (j.statuses) state.statuses = j.statuses;
      $('login').hidden = true; $('app').hidden = false; $('signout').hidden = false;
      say('app-msg', '');
      render();
    }).catch(function (err) {
      if (err.message !== 'unauthorized') say(state.orders.length ? 'app-msg' : 'login-msg', 'Couldn\'t load orders: ' + err.message, true);
    }).then(function () { $('refresh').disabled = false; });
  }

  function fmtDate(iso) {
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + '\n' +
      d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function statusSelect(order, card) {
    var sel = el('select', { class: 'status-select', 'aria-label': 'Status for ' + order.name });
    state.statuses.forEach(function (s) { sel.appendChild(el('option', { value: s, text: LABELS[s] || s })); });
    sel.value = order.status;
    sel.addEventListener('change', function () {
      var prev = order.status;
      sel.disabled = true;
      patch(order, { status: sel.value }).then(function () {
        renderDeliveries();
        card.className = 'order s-' + order.status + (card.classList.contains('open') ? ' open' : '');
        renderCounts();
      }).catch(function (err) {
        sel.value = prev;
        if (err.message !== 'unauthorized') say('app-msg', 'Couldn\'t update status: ' + err.message, true);
      }).then(function () { sel.disabled = false; });
    });
    return sel;
  }

  function fact(label, value) {
    if (!value) return [];
    return [el('dt', { text: label }), el('dd', {}, [value])];
  }

  function orderCard(o) {
    var card = el('div', { class: 'order s-' + o.status });
    var fileNode = null;
    if (/^https:\/\//.test(o.design_file)) {
      fileNode = el('a', { href: o.design_file, target: '_blank', rel: 'noopener', text: 'Download ' + (o.file_name || 'design file') });
    } else if (o.design_file) {
      fileNode = el('span', { class: 'warn', text: o.design_file });
    }
    var notes = el('textarea', { 'aria-label': 'Private notes', placeholder: 'Private notes (only you see these)…' });
    notes.value = o.notes || '';
    var saveNotes = el('button', { type: 'button', text: 'Save notes' });
    saveNotes.addEventListener('click', function () {
      saveNotes.disabled = true;
      patch(o, { notes: notes.value }).then(function () {
        saveNotes.textContent = 'Saved';
        setTimeout(function () { saveNotes.textContent = 'Save notes'; }, 1500);
      }).catch(function (err) {
        if (err.message !== 'unauthorized') say('app-msg', 'Couldn\'t save notes: ' + err.message, true);
      }).then(function () { saveNotes.disabled = false; });
    });
    var delBtn = el('button', { type: 'button', class: 'danger', text: 'Delete order' });
    delBtn.addEventListener('click', function () {
      if (!confirm('Delete this order from the log? This can\'t be undone.')) return;
      var withFile = /^https:\/\//.test(o.design_file) && confirm('Also delete the uploaded design file?');
      delBtn.disabled = true;
      api('DELETE', { id: o.id, withFile: withFile }).then(function () {
        state.orders = state.orders.filter(function (x) { return x.id !== o.id; });
        render();
      }).catch(function (err) {
        delBtn.disabled = false;
        if (err.message !== 'unauthorized') say('app-msg', 'Couldn\'t delete: ' + err.message, true);
      });
    });

    var bodyId = 'order-' + o.id;
    var toggle = el('button', { type: 'button', class: 'toggle', 'aria-expanded': 'false', 'aria-controls': bodyId }, [
      el('span', { class: 'when', text: fmtDate(o.createdAt), style: 'white-space:pre-line' }),
      el('span', { class: 'who' }, [el('b', { text: o.name }), el('span', { text: [o.team ? 'FTC ' + o.team : '', o.part_type].filter(Boolean).join(' · ') })]),
      el('span', { class: 'price' + (o.escalated ? ' hand' : ''), text: o.price || '' }),
      el('span', { class: 'badge', text: o.delivery === 'delivery' ? 'Delivery' : 'Pickup' })
    ]);
    toggle.addEventListener('click', function () {
      var open = toggle.getAttribute('aria-expanded') !== 'true';
      toggle.setAttribute('aria-expanded', String(open));
      body.hidden = !open;
      card.classList.toggle('open', open);
    });
    card.appendChild(el('div', { class: 'order-head' }, [toggle, statusSelect(o, card)]));
    var body = el('div', { class: 'body', id: bodyId, hidden: '' }, [
      el('dl', { class: 'facts' }, [].concat(
        fact('Email', el('a', { href: 'mailto:' + o.email + '?subject=' + encodeURIComponent('Your Crackbotics quote'), text: o.email })),
        fact('Team', o.team ? 'FTC ' + o.team : ''),
        fact('Part', o.part),
        fact('Price', o.price),
        fact('Delivery', o.delivery === 'delivery' ? 'Local delivery' + (o.address ? ' — ' + o.address : ' (no address)') : 'Pickup'),
        fact('Design file', fileNode),
        fact(o.delivery === 'delivery' ? 'Delivery date' : 'Pickup date', o.delivered_at ? 'Handed over ' + new Date(o.delivered_at).toLocaleString()
          : o.delivery_date ? dayLabel(o.delivery_date) + (o.delivery_window ? ', ' + o.delivery_window : '') : ''),
        fact('Customer notes', o.details),
        fact('Received', new Date(o.createdAt).toLocaleString()),
        fact('Last updated', o.updatedAt ? new Date(o.updatedAt).toLocaleString() : '')
      )),
      o.quote_summary ? el('pre', { class: 'summary', text: o.quote_summary }) : null,
      notes,
      el('div', { class: 'row' }, [saveNotes, delBtn])
    ]);
    card.appendChild(body);
    return card;
  }

  function renderCounts() {
    var counts = {};
    state.orders.forEach(function (o) { counts[o.status] = (counts[o.status] || 0) + 1; });
    var box = $('counts'); box.textContent = '';
    var open = state.orders.filter(function (o) { return OPEN.indexOf(o.status) !== -1; }).length;
    box.appendChild(el('span', { class: 'chip' }, [el('b', { text: String(open) }), ' open']));
    state.statuses.forEach(function (s) {
      if (counts[s]) box.appendChild(el('span', { class: 'chip' }, [el('b', { text: String(counts[s]) }), ' ' + (LABELS[s] || s).toLowerCase()]));
    });
    var filter = $('filter'), cur = filter.value || 'open';
    filter.textContent = '';
    [['open', 'Open orders'], ['all', 'All orders']].concat(state.statuses.map(function (s) { return [s, LABELS[s] || s]; }))
      .forEach(function (p) { filter.appendChild(el('option', { value: p[0], text: p[1] })); });
    filter.value = cur;
  }

  function render() {
    renderCounts();
    renderDeliveries();
    var term = $('q').value.trim().toLowerCase(), f = $('filter').value;
    var list = state.orders.filter(function (o) {
      if (f === 'open' && OPEN.indexOf(o.status) === -1) return false;
      if (f !== 'open' && f !== 'all' && o.status !== f) return false;
      if (!term) return true;
      return [o.name, o.team, o.email, o.part_type, o.part, o.details, o.notes, o.address].join(' ').toLowerCase().indexOf(term) !== -1;
    });
    state.shown = list;
    var n = filesIn(list).length, dl = $('dl-all');
    if (!state.downloading) {
      dl.textContent = 'Download files (' + n + ')';
      dl.disabled = !n;
    }
    dl.title = 'Download the design files for the ' + list.length + ' order' + (list.length === 1 ? '' : 's') + ' shown, as one ZIP';
    var box = $('orders'); box.textContent = '';
    if (!list.length) box.appendChild(el('p', { class: 'empty', text: state.orders.length ? 'No orders match.' : 'No orders yet.' }));
    list.forEach(function (o) { box.appendChild(orderCard(o)); });
  }

  // ---- Deliveries: schedule handoffs by day, order the stops, route them ----
  var COMMITTED = ['paid', 'in-progress', 'ready'];
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dayLabel(s) {
    var p = String(s).split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
    return isNaN(d) ? s : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function mapsSearch(addr) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr); }
  // Google Maps takes a destination plus up to 9 waypoints per link, starting from
  // wherever you are; longer runs are split into legs that chain end-to-start.
  function routeLinks(addrs) {
    var links = [];
    for (var k = 0; k < addrs.length; k += 10) {
      var leg = addrs.slice(k, k + 10).map(function (a) { return a.replace(/\|/g, ' '); });
      var u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(leg[leg.length - 1]);
      if (k) u += '&origin=' + encodeURIComponent(addrs[k - 1].replace(/\|/g, ' '));
      if (leg.length > 1) u += '&waypoints=' + encodeURIComponent(leg.slice(0, -1).join('|'));
      links.push(u);
    }
    return links;
  }
  function byStop(a, b) { return (a.delivery_stop || 999) - (b.delivery_stop || 999) || (a.createdAt < b.createdAt ? -1 : 1); }
  function byWindow(a, b) { return String(a.delivery_window || '~').localeCompare(String(b.delivery_window || '~')) || (a.createdAt < b.createdAt ? -1 : 1); }

  function customerMail(o) {
    var del = o.delivery === 'delivery', when = dayLabel(o.delivery_date) + (o.delivery_window ? ', ' + o.delivery_window : '');
    var body = 'Hi ' + (o.name || '').split(' ')[0] + ',\n\n' +
      'Your Crackbotics order' + (o.part_type ? ' (' + o.part_type + ')' : '') +
      (del ? ' is scheduled for delivery on ' + when + ', to:\n' + (o.address || '') + '\n\n'
           : ' will be ready for pickup on ' + when + '.\n\n') +
      'Reply to this email if that time doesn\'t work and we\'ll find another.\n\n— Crackbotics';
    return 'mailto:' + o.email + '?subject=' + encodeURIComponent('Your Crackbotics ' + (del ? 'delivery' : 'pickup') + ' — ' + when) +
      '&body=' + encodeURIComponent(body);
  }

  function reorder(list, idx, dir) {
    var j = idx + dir;
    if (j < 0 || j >= list.length) return;
    var arr = list.slice(), t = arr[idx]; arr[idx] = arr[j]; arr[j] = t;
    var jobs = [];
    arr.forEach(function (o, i) { if (o.delivery_stop !== i + 1) { o.delivery_stop = i + 1; jobs.push(o); } });
    renderDeliveries();
    jobs.forEach(function (o) { patch(o, { delivery_stop: o.delivery_stop }).catch(function (err) { failed('save the stop order')(err); load(); }); });
  }

  function stopItem(o, ctx) {
    var del = o.delivery === 'delivery';
    var li = el('li', { class: 'stop' });
    var num = el('div', { class: 'stop-num' });
    if (ctx.list) {
      num.appendChild(el('span', { text: String(ctx.idx + 1) }));
      var up = el('button', { type: 'button', class: 'sm', text: '↑', 'aria-label': 'Move ' + o.name + ' earlier', onclick: function () { reorder(ctx.list, ctx.idx, -1); } });
      var down = el('button', { type: 'button', class: 'sm', text: '↓', 'aria-label': 'Move ' + o.name + ' later', onclick: function () { reorder(ctx.list, ctx.idx, 1); } });
      up.disabled = ctx.idx === 0; down.disabled = ctx.idx === ctx.list.length - 1;
      num.appendChild(el('div', { class: 'move' }, [up, down]));
    }
    li.appendChild(num);

    var ready = o.status === 'ready';
    var addr = del
      ? (o.address ? el('a', { href: mapsSearch(o.address), target: '_blank', rel: 'noopener', text: o.address })
                   : el('span', { class: 'warn', text: 'No address — use Edit to add one' }))
      : el('span', { class: 'meta', text: 'Pickup' });
    li.appendChild(el('div', { class: 'stop-main' }, [
      el('div', { class: 'who-line' }, [
        el('b', { text: o.name }),
        el('span', { class: 'st' + (ready ? ' ready' : ctx.scheduled && !ready ? ' early' : ''), text: LABELS[o.status] || o.status })
      ]),
      addr,
      el('div', { class: 'meta', text: [o.team ? 'FTC ' + o.team : '', o.part_type, o.price, o.delivery_window ? 'Window ' + o.delivery_window : ''].filter(Boolean).join(' · ') }),
      el('div', { class: 'meta' }, [el('a', { href: 'mailto:' + o.email, text: o.email })]),
      el('div', { class: 'print-only meta', text: '☐ ' + (del ? 'Delivered' : 'Picked up') + '    ☐ Paid' })
    ]));

    // Inline editor: day, time window, address.
    var date = el('input', { type: 'date', 'aria-label': 'Date for ' + o.name }); date.value = o.delivery_date || '';
    var win = el('input', { type: 'text', maxlength: '40', placeholder: 'e.g. 4–6 pm', 'aria-label': 'Time window for ' + o.name }); win.value = o.delivery_window || '';
    var addrIn = el('input', { type: 'text', maxlength: '300', 'aria-label': 'Address for ' + o.name }); addrIn.value = o.address || '';
    var save = el('button', { type: 'button', class: 'primary sm', text: 'Save' });
    var edit = el('div', { class: 'edit', hidden: '' }, [
      el('label', {}, ['Date', date]),
      el('label', {}, ['Time window', win]),
      del ? el('label', { class: 'addr-field' }, ['Address', addrIn]) : null,
      el('div', { class: 'row' }, [save,
        o.delivery_date ? el('button', { type: 'button', class: 'sm', text: 'Unschedule', onclick: function () {
          patch(o, { delivery_date: '', delivery_stop: 0 }).then(render, failed('unschedule'));
        } }) : null])
    ]);
    save.addEventListener('click', function () {
      if (!date.value) { date.focus(); say('app-msg', 'Pick a date first.', true); return; }
      var changes = { delivery_date: date.value, delivery_window: win.value };
      if (del) changes.address = addrIn.value;
      if (date.value !== o.delivery_date) {
        // New day: go to the end of that day's route.
        changes.delivery_stop = state.orders.filter(function (x) { return x !== o && x.delivery_date === date.value; })
          .reduce(function (m, x) { return Math.max(m, x.delivery_stop || 0); }, 0) + 1;
      }
      save.disabled = true;
      patch(o, changes).then(function () { say('app-msg', ''); render(); }, function (err) { save.disabled = false; failed('save')(err); });
    });

    var toggle = el('button', { type: 'button', class: 'sm', 'aria-expanded': 'false', text: o.delivery_date ? 'Edit' : 'Schedule' });
    toggle.addEventListener('click', function () {
      var open = edit.hidden; edit.hidden = !open; toggle.setAttribute('aria-expanded', String(open));
      if (open) (o.delivery_date ? win : date).focus();
    });
    var actions = el('div', { class: 'stop-actions' }, [toggle]);
    if (o.delivery_date) actions.appendChild(el('a', { class: 'btn-link', href: customerMail(o), text: 'Email time' }));
    if (o.delivery_date) {
      var done = el('button', { type: 'button', class: 'sm', text: del ? 'Delivered' : 'Picked up' });
      done.addEventListener('click', function () {
        done.disabled = true;
        patch(o, { status: 'done', delivered: true }).then(render, function (err) { done.disabled = false; failed('mark it done')(err); });
      });
      actions.appendChild(done);
    }
    li.appendChild(actions);
    li.appendChild(edit);
    return li;
  }

  function printDay(dayEl) {
    function clean() {
      document.body.classList.remove('printing');
      [].forEach.call(document.querySelectorAll('.print-me'), function (n) { n.classList.remove('print-me'); });
    }
    clean();
    document.body.classList.add('printing'); dayEl.classList.add('print-me');
    window.addEventListener('afterprint', clean, { once: true });
    window.print();
  }

  function renderDeliveries() {
    var box = $('deliv');
    if (!box) return;
    var withPickups = $('with-pickups').checked, today = ymd(new Date());
    var mine = state.orders.filter(function (o) { return withPickups || o.delivery === 'delivery'; });
    var active = mine.filter(function (o) {
      return o.status !== 'done' && o.status !== 'cancelled' && (o.delivery_date || COMMITTED.indexOf(o.status) !== -1);
    });
    var waiting = mine.filter(function (o) { return !o.delivery_date && (o.status === 'new' || o.status === 'quoted'); }).length;
    var twoWeeks = Date.now() - 14 * 864e5;
    var recent = mine.filter(function (o) { return o.status === 'done' && o.delivered_at && Date.parse(o.delivered_at) > twoWeeks; })
      .sort(function (a, b) { return a.delivered_at < b.delivered_at ? 1 : -1; });
    $('tab-deliv').textContent = 'Deliveries' + (active.length ? ' (' + active.length + ')' : '');
    box.textContent = '';

    var unscheduled = active.filter(function (o) { return !o.delivery_date; })
      .sort(function (a, b) { return a.createdAt < b.createdAt ? -1 : 1; });
    if (unscheduled.length) {
      var ul = el('ul', { class: 'stops' });
      unscheduled.forEach(function (o) { ul.appendChild(stopItem(o, {})); });
      box.appendChild(el('section', { class: 'day' }, [
        el('div', { class: 'day-head' }, [el('h2', { text: 'Needs a date' }), el('span', { class: 'tag', text: unscheduled.length + ' to schedule' })]),
        ul]));
    }

    var days = {};
    active.forEach(function (o) { if (o.delivery_date) (days[o.delivery_date] = days[o.delivery_date] || []).push(o); });
    Object.keys(days).sort().forEach(function (d) {
      var drops = days[d].filter(function (o) { return o.delivery === 'delivery'; }).sort(byStop);
      var pickups = days[d].filter(function (o) { return o.delivery !== 'delivery'; }).sort(byWindow);
      var section = el('section', { class: 'day' });
      var tools = el('div', { class: 'row no-print' });
      var addrs = drops.map(function (o) { return o.address; }).filter(Boolean);
      routeLinks(addrs).forEach(function (u, i, all) {
        tools.appendChild(el('a', { class: 'btn-link', href: u, target: '_blank', rel: 'noopener',
          text: all.length > 1 ? 'Route part ' + (i + 1) + ' of ' + all.length : 'Open route in Maps' }));
      });
      tools.appendChild(el('button', { type: 'button', class: 'sm', text: 'Print run sheet', onclick: function () { printDay(section); } }));
      var tag = d < today ? el('span', { class: 'tag late', text: 'Overdue' }) : d === today ? el('span', { class: 'tag today', text: 'Today' }) : null;
      section.appendChild(el('div', { class: 'day-head' }, [el('h2', { text: dayLabel(d) }), tag,
        el('span', { class: 'tag', text: [drops.length ? drops.length + ' drop-off' + (drops.length === 1 ? '' : 's') : '', pickups.length ? pickups.length + ' pickup' + (pickups.length === 1 ? '' : 's') : ''].filter(Boolean).join(' · ') }),
        tools]));
      if (drops.length) {
        var ol = el('ol', { class: 'stops' });
        drops.forEach(function (o, i) { ol.appendChild(stopItem(o, { list: drops, idx: i, scheduled: true })); });
        if (pickups.length) section.appendChild(el('p', { class: 'sub', text: 'Drop-offs, in route order' }));
        section.appendChild(ol);
      }
      if (pickups.length) {
        var pl = el('ul', { class: 'stops' });
        pickups.forEach(function (o) { pl.appendChild(stopItem(o, { scheduled: true })); });
        section.appendChild(el('p', { class: 'sub', text: 'Pickups' }));
        section.appendChild(pl);
      }
      box.appendChild(section);
    });

    if (!active.length) box.appendChild(el('p', { class: 'empty', text: 'Nothing to deliver right now.' }));
    if (waiting) box.appendChild(el('p', { class: 'msg no-print', text: waiting + ' more ' + (withPickups ? 'order' : 'delivery request') + (waiting === 1 ? ' is' : 's are') +
      ' still New or Quoted. They show up here once you mark them Paid, In progress or Ready.' }));

    if (recent.length) {
      var rl = el('ul', { class: 'stops' });
      recent.forEach(function (o) {
        var undo = el('button', { type: 'button', class: 'sm', text: 'Undo' });
        undo.addEventListener('click', function () {
          undo.disabled = true;
          patch(o, { status: 'ready', delivered: false }).then(render, function (err) { undo.disabled = false; failed('undo')(err); });
        });
        rl.appendChild(el('li', { class: 'stop' }, [
          el('div', { class: 'stop-num', text: '✓' }),
          el('div', { class: 'stop-main' }, [el('b', { text: o.name }),
            el('span', { class: 'meta', text: (o.delivery === 'delivery' ? 'Delivered ' : 'Picked up ') + new Date(o.delivered_at).toLocaleString() + (o.address && o.delivery === 'delivery' ? ' · ' + o.address : '') })]),
          el('div', { class: 'stop-actions' }, [undo])
        ]));
      });
      box.appendChild(el('section', { class: 'day no-print' }, [el('div', { class: 'day-head' }, [el('h2', { text: 'Handed over, last 14 days' })]), rl]));
    }
  }

  function showTab(which) {
    var deliv = which === 'deliv';
    $('view-orders').hidden = deliv; $('view-deliv').hidden = !deliv;
    $('tab-orders').setAttribute('aria-pressed', String(!deliv)); $('tab-deliv').setAttribute('aria-pressed', String(deliv));
    try { sessionStorage.setItem('cb-admin-tab', which); } catch (e) {}
  }

  // ---- Bulk download: every design file for the orders currently shown ----
  function filesIn(list) { return list.filter(function (o) { return /^https:\/\//.test(o.design_file); }); }

  function loadZipLib() {
    if (window.fflate) return Promise.resolve(window.fflate);
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
      s.onload = function () { window.fflate ? resolve(window.fflate) : reject(new Error('ZIP library didn\'t load')); };
      s.onerror = function () { reject(new Error('ZIP library didn\'t load')); };
      document.head.appendChild(s);
    });
  }

  function safeName(s) {
    return String(s || '').replace(/[\\/:*?"<>|\x00-\x1f]+/g, '_').replace(/\s+/g, ' ').trim().slice(0, 80);
  }
  function fileNameOf(o) {
    if (o.file_name) return safeName(o.file_name);
    try { return safeName(decodeURIComponent(new URL(o.design_file).pathname.split('/').pop())); } catch (e) { return 'design-file'; }
  }
  function isoDay(iso) { var d = new Date(iso); return isNaN(d) ? 'undated' : d.toISOString().slice(0, 10); }

  // Quotes every cell, and defuses anything a spreadsheet would run as a formula.
  function csvCell(v) {
    v = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;
    return '"' + v.replace(/"/g, '""') + '"';
  }

  function saveBlob(blob, name) {
    var a = el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
  }

  // If the files can't be fetched into a ZIP, hand each one to the browser to download.
  function downloadOneByOne(list) {
    var seen = {};
    list = list.filter(function (o) { return !seen[o.design_file] && (seen[o.design_file] = 1); });
    var i = 0;
    (function next() {
      if (i >= list.length) { say('app-msg', 'Started ' + list.length + ' downloads. If only one arrived, allow multiple downloads for this site and try again.'); return; }
      // A hidden frame per file: the blob host sends ?download=1 as an attachment, and a
      // missing file just fails inside the frame instead of navigating this page away.
      var u = list[i++].design_file;
      var f = el('iframe', { src: u + (u.indexOf('?') === -1 ? '?' : '&') + 'download=1', hidden: '', title: 'download' });
      document.body.appendChild(f);
      setTimeout(function () { f.remove(); }, 60000);
      setTimeout(next, 700);
    })();
  }

  function downloadAll() {
    var list = filesIn(state.shown || []);
    if (!list.length) return;
    var btn = $('dl-all');
    state.downloading = true; btn.disabled = true; btn.textContent = 'Preparing…';
    var entries = {}, used = {}, rows = [], missing = [];
    function finish() { state.downloading = false; render(); }

    loadZipLib().then(function (fflate) {
      var done = 0, i = 0;
      function fetchNext() {
        if (i >= list.length) return Promise.resolve();
        var o = list[i++];
        say('app-msg', 'Downloading ' + (done + 1) + ' of ' + list.length + '…');
        return fetch(o.design_file, { cache: 'no-store' }).then(function (r) {
          if (!r.ok) { missing.push(o); return null; }
          return r.arrayBuffer();
        }, function (err) {
          // A network/CORS failure on the very first file means none will work — fall back.
          if (!done && !Object.keys(entries).length) { err.fallback = true; throw err; }
          missing.push(o); return null;
        }).then(function (buf) {
          done++;
          var fname = fileNameOf(o);
          var base = isoDay(o.createdAt) + '_' + (safeName(o.name) || 'order') + '_' + fname, name = base, k = 2;
          while (used[name.toLowerCase()]) { name = base.replace(/(\.[^.]*)?$/, '-' + (k++) + '$1'); }
          if (buf) { used[name.toLowerCase()] = 1; entries['files/' + name] = new Uint8Array(buf); }
          rows.push([o.name, o.email, o.team, o.part_type, o.part, o.price, LABELS[o.status] || o.status,
            o.delivery === 'delivery' ? 'Delivery' : 'Pickup', o.address, buf ? 'files/' + name : 'MISSING (' + fname + ')',
            new Date(o.createdAt).toLocaleString()]);
          return fetchNext();
        });
      }
      return fetchNext().then(function () {
        if (!Object.keys(entries).length) throw new Error('none of the files could be downloaded — they may have been deleted');
        say('app-msg', 'Zipping…');
        var head = ['Name', 'Email', 'Team', 'Part type', 'Part', 'Price', 'Status', 'Delivery', 'Address', 'File in ZIP', 'Received'];
        var csv = [head].concat(rows).map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
        entries['orders.csv'] = fflate.strToU8('﻿' + csv);
        var zip = fflate.zipSync(entries, { level: 6 });
        var stamp = new Date().toISOString().slice(0, 10);
        saveBlob(new Blob([zip], { type: 'application/zip' }), 'crackbotics-files-' + stamp + '.zip');
        var got = list.length - missing.length;
        say('app-msg', 'Downloaded ' + got + ' file' + (got === 1 ? '' : 's') + ' as a ZIP' +
          (missing.length ? '. Couldn\'t get ' + missing.length + ' (marked MISSING in orders.csv): ' + missing.map(function (o) { return o.name; }).join(', ') : '.'), !!missing.length);
      });
    }).catch(function (err) {
      if (err && err.fallback || /ZIP library/.test(err && err.message)) {
        say('app-msg', 'Couldn\'t build a ZIP here — downloading the files one by one instead…');
        downloadOneByOne(list);
      } else {
        say('app-msg', 'Couldn\'t download files: ' + (err && err.message), true);
      }
    }).then(finish);
  }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    state.pw = $('pw').value;
    say('login-msg', 'Checking…');
    load().then(function () { if (!$('app').hidden) { storeSet(state.pw); $('pw').value = ''; } });
  });
  $('signout').addEventListener('click', function () { signOut(''); });
  $('refresh').addEventListener('click', load);
  $('dl-all').addEventListener('click', downloadAll);
  $('tab-orders').addEventListener('click', function () { showTab('orders'); });
  $('tab-deliv').addEventListener('click', function () { showTab('deliv'); });
  $('with-pickups').addEventListener('change', renderDeliveries);
  try { if (sessionStorage.getItem('cb-admin-tab') === 'deliv') showTab('deliv'); } catch (e) {}
  $('q').addEventListener('input', render);
  $('filter').addEventListener('change', render);

  state.pw = storeGet();
  if (state.pw) load();
})();
</script>
</body>
</html>
